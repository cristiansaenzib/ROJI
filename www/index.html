<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo de pedidos</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1b19;--mu:#6b6862;--bd:#e3e0d9;--ac:#1f5f4a;--acx:#fff;--im:#efede8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151513;--card:#201f1c;--tx:#f0eee9;--mu:#a09c93;--bd:#35332e;--ac:#5fbf9d;--acx:#0d1f19;--im:#2a2926}}
:root[data-theme="dark"]{--bg:#151513;--card:#201f1c;--tx:#f0eee9;--mu:#a09c93;--bd:#35332e;--ac:#5fbf9d;--acx:#0d1f19;--im:#2a2926}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(86px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 16px 8px;border-bottom:1px solid var(--bd)}
.w{max-width:980px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:18px;margin:0}
label.sel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
select,input[type=search]{padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
select{font-weight:600;border-color:var(--ac)}
.fl{display:flex;gap:8px;margin-top:8px}
.fl input{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.tab{flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{max-width:980px;margin:0 auto;padding:12px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;text-align:left;padding:0;color:inherit;font:inherit}
.card:hover{border-color:var(--ac)}
.im{background:var(--im);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.im svg,.im img{width:82%;height:82%;object-fit:contain}
.ci{padding:8px 10px 10px}
.ci b{display:block;font-size:14px;line-height:1.25}
.ci small{color:var(--mu);font-size:12px}
.pp{font-weight:700;margin-top:2px}
.qb{position:absolute;top:8px;right:8px;background:var(--ac);color:var(--acx);font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px}
.low{color:#b45309}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .w{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .t{font-size:12px;color:var(--mu)}.bar .v{font-size:20px;font-weight:700}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(620px,95vw);padding:16px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two figure{margin:0;text-align:center}
.two .im{border-radius:12px}
.two figcaption{font-size:12px;color:var(--mu);margin-top:4px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:12px 0 4px}
.hd h2{margin:0;font-size:18px}
.pr{font-size:22px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.sz{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--bd)}
.sz .n{width:46px;font-weight:700}.sz .s{flex:1;color:var(--mu);font-size:13px}
.st{display:flex;align-items:center;gap:8px}
.st button{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.st button:disabled{opacity:.35}
.st span{min-width:24px;text-align:center;font-weight:700}
.x{background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child,th:first-child{text-align:left}
.tot td{font-weight:700;font-size:16px;border:0}
.warn{background:rgba(180,83,9,.12);color:#b45309;border-radius:10px;padding:8px 10px;font-size:13px;margin:10px 0}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.ap{border:1px solid var(--bd);border-radius:12px;padding:10px;margin:10px 0}
.ap.off{opacity:.55}
.ah{display:flex;gap:10px;align-items:center}
.ah .im{width:56px;height:56px;border-radius:8px;flex:none}
.ah .im svg,.ah .im img{width:90%;height:90%}
.sg{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sg label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px;align-items:center}
.sg input,.fm input{padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.sg input{width:62px;text-align:center}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fm label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.fm .f{grid-column:1/-1}
.fm input[type=color]{padding:2px;height:38px}
.mini{padding:6px 10px;font-size:13px}
.ba{display:flex;gap:6px;flex-wrap:wrap}
.fm select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.leg{font-size:12px;color:var(--mu);margin-top:6px}
.rls{margin:8px 0}
.rl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;font-size:14px}
.rl small{color:var(--mu);font-size:12px}
.rl.on{border-color:var(--ac);background:rgba(31,95,74,.12)}
</style>
</head>
<body>
<header><div class="w">
  <div class="top"><h1>Catálogo</h1><button class="btn s" id="cbtn" style="padding:6px 10px;font-size:13px">👤 Soy cliente</button><button class="btn s" id="adm" style="padding:6px 10px;font-size:13px">Admin</button>
    </div>
  <div class="fl"><input type="search" id="q" placeholder="Buscar referencia…"></div>
  <div class="tabs" id="tabs"></div>
  <div class="leg">Los precios se aplican solos por referencia: Detal · Distribuidor desde 6 uds en 3 tallas (1-1-4) · Mayorista desde 12 uds en 3 tallas (2-2-8)</div>
</div></header>
<main><div class="grid" id="grid"></div></main>
<div class="bar"><div class="w">
  <div><div class="t" id="cnt">0 unidades</div><div class="v" id="tot">$0</div></div>
  <button class="btn" id="ver">Ver pedido</button>
</div></div>
<dialog id="dlg"></dialog>
<dialog id="adlg"></dialog>
<dialog id="cdlg"></dialog>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script>
// ===== CONFIGURACIÓN SUPABASE (Project Settings > API) =====
const SB_URL=window.APP_CONFIG.url;
const SB_KEY=window.APP_CONFIG.key;
const MIN={detal:1,dist:6,mayor:12};
const TN={detal:"Detal",dist:"Distribuidor",mayor:"Mayorista"};
let CAT=[];
// ===== Dibujo provisional (reemplazable por fotos) =====
function art(p,side){
 const f=side==="f",st=p.c.toLowerCase()==="#f4f4f4"?"#bbb":"rgba(0,0,0,.35)";
 const neck=f?30:20;let body="",det="";
 if(p.t==="Camisetas"){
  body=`M70 20 L40 35 L10 75 L35 90 L50 78 L50 200 L150 200 L150 78 L165 90 L190 75 L160 35 L130 20 Q100 ${neck+15} 70 20Z`;
  det=f?`<circle cx="100" cy="95" r="12" fill="${p.a}"/>`:`<rect x="72" y="80" width="56" height="56" rx="8" fill="${p.a}" opacity=".9"/>`;
 }else if(p.t==="Chaquetas"){
  body=`M72 18 L35 32 L14 135 L40 140 L52 75 L52 208 L148 208 L148 75 L160 140 L186 135 L165 32 L128 18 Q100 ${neck+8} 72 18Z`;
  det=f?`<line x1="100" y1="${neck+8}" x2="100" y2="208" stroke="${p.a}" stroke-width="4"/><rect x="62" y="150" width="26" height="6" rx="3" fill="${p.a}"/><rect x="112" y="150" width="26" height="6" rx="3" fill="${p.a}"/>`:`<rect x="52" y="190" width="96" height="10" fill="${p.a}" opacity=".8"/><circle cx="100" cy="100" r="16" fill="${p.a}"/>`;
 }else{
  body=`M55 12 L145 12 L156 208 L108 208 L100 85 L92 208 L44 208Z`;
  det=f?`<path d="M100 12 L100 70 Q108 76 112 70" fill="none" stroke="${p.a}" stroke-width="3"/><rect x="55" y="12" width="90" height="10" fill="${p.a}" opacity=".7"/>`:`<rect x="62" y="40" width="26" height="24" rx="3" fill="none" stroke="${p.a}" stroke-width="3"/><rect x="112" y="40" width="26" height="24" rx="3" fill="none" stroke="${p.a}" stroke-width="3"/>`;
 }
 return `<svg viewBox="0 0 200 220"><path d="${body}" fill="${p.c}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/>${det}</svg>`}
const pic=(p,side)=>p.img?`<img src="${p.img[side==="f"?0:1]}" alt="${p.n}">`:art(p,side);
// ===== Lógica =====
const fmt=n=>"$"+Math.round(n).toLocaleString("es-CO");
let Q={},cli="detal",tab="Todos",flt="";

const save=()=>{}; // tablet compartida: nada se guarda en el equipo
const pu=p=>Object.keys(p.s).reduce((a,z)=>a+(Q[p.id+"|"+z]||0),0);
const stock=p=>Object.values(p.s).reduce((a,b)=>a+b,0);
const tierOf=q=>{const x=q.filter(n=>n>0).sort((a,b)=>b-a),t=x.reduce((a,b)=>a+b,0);
 if(x.length<3)return"detal";
 if(t>=12&&x[0]>=8&&x[1]>=2&&x[2]>=2)return"mayor";
 if(t>=6&&x[0]>=4&&x[1]>=1&&x[2]>=1)return"dist";
 return"detal"};
const discPct=(p,u)=>p.disc?(u>=4?15:u===3?10:u===2?5:0):0;
function pricing(p){
 const q=Object.keys(p.s).map(z=>Q[p.id+"|"+z]||0),u=q.reduce((a,b)=>a+b,0),bt=CUST?CUST.type:"detal",qt=u?tierOf(q):"detal",tier=RK[qt]>RK[bt]?qt:bt;
 const pct=tier==="detal"?discPct(p,u):0,unit=tier==="detal"?Math.round(p.p.detal*(1-pct/100)):p.p[tier];
 let hint="";
 if(u){
  if(tier==="detal"){hint=u<6?`Faltan ${6-u} uds para precio distribuidor (en 3 tallas, mínimo 1-1-4)`:"Para precio distribuidor reparte en 3 tallas (mínimo 1-1-4)";
   if(p.disc&&u<4)hint=`Lleva ${u+1} y ahorra ${discPct(p,u+1)}% · `+hint}
  else if(tier==="dist")hint=u<12?`Faltan ${12-u} uds para precio mayorista (en 3 tallas, mínimo 2-2-8)`:"Para precio mayorista reparte en 3 tallas (mínimo 2-2-8)"}
 return{u,tier,pct,unit,hint}}
const RK={detal:1,dist:2,mayor:3};
function totals(){let u=0,t=0,sv=0,hi="detal";
 CAT.forEach(p=>{const x=pu(p);if(!x)return;const r=pricing(p);u+=x;t+=x*r.unit;sv+=x*(p.p.detal-r.unit);if(RK[r.tier]>RK[hi])hi=r.tier});
 return{u,t,sv,hi}}
function grid(){
 const tabs=["Todos",...new Set(CAT.filter(p=>p.active).map(p=>p.t))];
 document.getElementById("tabs").innerHTML=tabs.map(x=>`<button class="tab ${x===tab?"on":""}" data-tab="${x}">${x}</button>`).join("");
 const f=flt.toLowerCase();
 const it=CAT.filter(p=>p.active&&(tab==="Todos"||p.t===tab)&&(!f||(p.id+p.n).toLowerCase().includes(f)));
 document.getElementById("grid").innerHTML=it.length?it.map(p=>{const u=pu(p),s=stock(p);return `<button class="card" data-id="${p.id}">
  ${u?`<span class="qb">${u}</span>`:""}<div class="im">${pic(p,"f")}</div>
  <div class="ci"><b>${p.n}</b><small>${p.id} · <span class="${s<10?"low":""}">${s>0?s+" disp.":"Agotado"}</span></small><div class="pp">${fmt(pricing(p).unit)}</div><small style="display:block">Mayor desde ${fmt(p.p.mayor)}</small></div></button>`}).join(""):`<div class="empty">Sin resultados</div>`;
 const T=totals();
 document.getElementById("cnt").textContent=T.u+(T.u===1?" unidad":" unidades")+(T.hi!=="detal"?" · "+TN[T.hi]:"");
 document.getElementById("tot").textContent=fmt(T.t);
}
const D=document.getElementById("dlg");
function rulesHTML(p,r){
 const row=(on,t,pp,sub)=>`<div class="rl ${on?"on":""}"><div><b>${t}</b><br><small>${sub}</small></div><b>${fmt(pp)}</b></div>`;
 return `<div class="rls">${row(r.tier==="detal","Detal",p.p.detal,p.disc?"2 uds −5% · 3 uds −10% · 4 o más −15%":"Hasta 5 unidades")}
 ${row(r.tier==="dist","Distribuidor",p.p.dist,"6 a 11 uds en 3 tallas (mínimo 1-1-4)")}
 ${row(r.tier==="mayor","Mayorista",p.p.mayor,"12 o más uds en 3 tallas (mínimo 2-2-8)")}</div>`}
function detail(id){
 const p=CAT.find(x=>x.id===id),r=pricing(p);D.dataset.id=id;
 D.innerHTML=`<div style="display:flex;justify-content:flex-end"><button class="x" data-close>×</button></div>
 <div class="two"><figure><div class="im">${pic(p,"f")}</div><figcaption>Frente</figcaption></figure><figure><div class="im">${pic(p,"b")}</div><figcaption>Espalda</figcaption></figure></div>
 <div class="hd"><div><h2>${p.n}</h2><small style="color:var(--mu)">${p.id} · ${stock(p)} unidades en existencia</small></div>
 <div style="text-align:right"><div class="pr">${fmt(r.unit)}</div>${r.u?`<small style="color:var(--mu)">${TN[r.tier]}${r.pct?" −"+r.pct+"%":""} · ${r.u} uds</small>`:""}</div></div>
 ${rulesHTML(p,r)}
 ${r.hint?`<div class="warn" style="background:rgba(31,95,74,.12);color:var(--ac)">${r.hint}</div>`:""}
 ${Object.keys(p.s).map(z=>{const q=Q[p.id+"|"+z]||0,s=p.s[z];return `<div class="sz"><div class="n">${z}</div><div class="s">${s>0?s+" disponibles":"Agotado"}</div>
 <div class="st"><button data-m="-" data-z="${z}" ${q?"":"disabled"}>−</button><span>${q}</span><button data-m="+" data-z="${z}" ${q>=s?"disabled":""}>+</button></div></div>`}).join("")}
 <div class="row"><button class="btn" data-close>Listo · ${r.u} uds</button></div>`;
 if(!D.open)D.showModal();
}
function order(){
 const T=totals(),rows=[];
 CAT.forEach(p=>Object.keys(p.s).forEach(z=>{const q=Q[p.id+"|"+z];if(q)rows.push({p,z,q,r:pricing(p)})}));
 let h='<div style="display:flex;justify-content:space-between"><h2 style="margin:0">Mi pedido</h2><button class="x" data-close>×</button></div>';
 if(!rows.length)h+='<div class="empty">Aún no has elegido prendas.</div><div class="row"><button class="btn s" data-close>Cerrar</button></div>';
 else h+=`<table><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr>${rows.map(({p,z,q,r})=>`<tr><td>${p.id} · ${z}<br><small style="color:var(--mu)">${p.n} · ${TN[r.tier]}${r.pct?" −"+r.pct+"%":""}</small></td><td>${q}</td><td>${fmt(r.unit)}</td><td>${fmt(q*r.unit)}</td></tr>`).join("")}
 ${T.sv>0?`<tr><td colspan="3">Ahorro</td><td style="color:var(--ac)">−${fmt(T.sv)}</td></tr>`:""}
 <tr class="tot"><td colspan="3">Total (${T.u} uds)</td><td>${fmt(T.t)}</td></tr></table>
 <div class="row"><button class="btn s" data-act="clr">Vaciar</button><button class="btn s" data-act="cp">Copiar</button><button class="btn" data-act="apart">Apartar</button>${sess?'<button class="btn" data-act="sell">Vender ahora</button>':""}</div>`;
 D.innerHTML=h;D.dataset.id="";if(!D.open)D.showModal();
}
function texto(){
 const T=totals(),l=[];
 CAT.forEach(p=>Object.keys(p.s).forEach(z=>{const q=Q[p.id+"|"+z];if(q)l.push(`${q} x ${p.id} ${p.n} talla ${z} @ ${fmt(pricing(p).unit)}`)}));
 return "PEDIDO\n"+l.join("\n")+`\nTOTAL: ${fmt(T.t)}`}
D.addEventListener("click",async e=>{
 const b=e.target.closest("button");
 if(!b){if(e.target===D)D.close();return}
 if(b.hasAttribute("data-close")){D.close();return}
 if(b.dataset.act==="clr"){Q={};save();grid();order();return}
 if(b.dataset.act==="apart"||b.dataset.act==="sell"){await submit(b.dataset.act);return}
 if(b.dataset.act==="cp"){try{await navigator.clipboard.writeText(texto());b.textContent="¡Copiado!"}catch(x){}return}
 if(b.dataset.m){const p=CAT.find(x=>x.id===D.dataset.id),k=p.id+"|"+b.dataset.z;
  let q=(Q[k]||0)+(b.dataset.m==="+"?1:-1);q=Math.max(0,Math.min(p.s[b.dataset.z],q));
  if(q)Q[k]=q;else delete Q[k];save();grid();detail(p.id)}
});
document.getElementById("grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)detail(c.dataset.id)});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b){tab=b.dataset.tab;grid()}});
document.getElementById("q").addEventListener("input",e=>{flt=e.target.value;grid()});
document.getElementById("ver").onclick=order;
let sb=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){
 const G=document.getElementById("grid");
 if(!sb){G.innerHTML='<div class="empty">Configura SB_URL y SB_KEY al inicio del código.</div>';return}
 const{data,error}=await sb.from("products").select("*,product_sizes(size,stock,reserved,sort)").order("created_at");
 if(error){G.innerHTML='<div class="empty">No se pudo cargar: '+esc(error.message)+'</div>';return}
 CAT=data.map(r=>({id:esc(r.id),t:esc(r.type),n:esc(r.name),c:r.color,a:r.accent,active:r.active,disc:r.disc_detal,
  p:{detal:r.price_detal,dist:r.price_dist,mayor:r.price_mayor},
  s:Object.fromEntries(r.product_sizes.sort((x,y)=>x.sort-y.sort).map(z=>[z.size,z.stock-z.reserved])),raw:Object.fromEntries(r.product_sizes.map(z=>[z.size,z])),
  img:r.img_front?[r.img_front,r.img_back||r.img_front]:null}));
 grid();
}
// ===== ADMIN =====
const A=document.getElementById("adlg");
let sess=null,edit=null;
const g=i=>A.querySelector("#"+i);
function aRender(){
 let h='';
 if(!sess){
  h=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">Administrador</h2><button class="x" data-close>×</button></div>
  <div class="fm"><label class="f">Correo<input id="em" type="email" autocomplete="username"></label><label class="f">Contraseña<input id="pw" type="password" autocomplete="current-password"></label></div>
  <div class="row"><button class="btn" data-a="login">Entrar</button></div>`;
 }else if(ecus!==null){h=cusForm()}else if(edit!==null){
  const n=edit==="new",p=n?{id:"",t:"",n:"",c:"#cccccc",a:"#1f5f4a",p:{detal:0,dist:0,mayor:0},s:{S:0,M:0,L:0,XL:0}}:CAT.find(x=>x.id===edit);
  h=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${n?"Nuevo producto":"Editar "+p.id}</h2><button class="x" data-close>×</button></div>
  <div class="fm">
   <label>Referencia<input id="f_id" value="${p.id}" ${n?"":"disabled"} placeholder="CAM-104"></label>
   <label>Categoría<input id="f_t" value="${p.t}" list="cats" placeholder="Camisetas"><datalist id="cats">${[...new Set(CAT.map(x=>x.t))].map(x=>`<option value="${x}">`).join("")}</datalist></label>
   <label class="f">Nombre<input id="f_n" value="${p.n}"></label>
   <label>Precio detal<input id="f_pd" type="number" min="0" value="${p.p.detal}"></label>
   <label>Precio distribuidor<input id="f_pi" type="number" min="0" value="${p.p.dist}"></label>
   <label>Precio mayorista<input id="f_pm" type="number" min="0" value="${p.p.mayor}"></label>
   <label>Tallas (separadas por coma)<input id="f_s" value="${Object.keys(p.s).join(",")}"></label>
   <label>Color del dibujo<input id="f_c" type="color" value="${p.c}"></label>
   <label>Color de detalle<input id="f_a" type="color" value="${p.a}"></label>
   <label class="f" style="flex-direction:row;align-items:center;gap:8px"><input id="f_d" type="checkbox" style="width:auto" ${p.disc?"checked":""}> Aplica descuento detal por cantidad (2 uds 5%, 3 uds 10%, 4 o más 15%)</label>
   <label>Foto frente<input id="f_if" type="file" accept="image/*"></label>
   <label>Foto espalda<input id="f_ib" type="file" accept="image/*"></label>
  </div>
  <div class="row"><button class="btn s" data-a="back">Cancelar</button><button class="btn" id="f_save" data-a="savep">Guardar</button></div>`;
 }else if(atab==="cli"){h=cliHTML()}else if(atab==="ped"){h=pedHTML()}else{
  h=tabsBar()+`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Inventario</h2><button class="x" data-close>×</button></div>
  <div class="ba" style="margin-top:8px"><button class="btn mini" data-a="new">+ Nuevo producto</button><button class="btn s mini" data-a="out">Salir</button></div>
  <small style="color:var(--mu)">Escribe la existencia actual por talla y pulsa Guardar stock.</small>
  ${CAT.map(p=>`<div class="ap ${p.active?"":"off"}"><div class="ah"><div class="im">${pic(p,"f")}</div><div style="flex:1"><b>${p.n}</b><br><small style="color:var(--mu)">${p.id} · ${p.t}${p.disc?" · Desc. detal":""}${p.active?"":" · Oculto"}</small></div></div>
  <div class="sg">${Object.entries(p.raw).map(([z,v])=>`<label>${z}<input type="number" min="0" value="${v.stock}" data-ps="${p.id}" data-z="${z}">${v.reserved?`<small>apart. ${v.reserved}</small>`:""}</label>`).join("")}</div>
  <div class="ba"><button class="btn mini" data-a="stock" data-id="${p.id}">Guardar stock</button><button class="btn s mini" data-a="zero" data-id="${p.id}">Agotar</button><button class="btn s mini" data-a="edit" data-id="${p.id}">Editar</button><button class="btn s mini" data-a="tog" data-id="${p.id}">${p.active?"Ocultar":"Mostrar"}</button><button class="btn s mini" data-a="del" data-id="${p.id}">Eliminar</button></div></div>`).join("")||'<div class="empty">Sin productos. Agrega el primero.</div>'}`;
 }
 A.innerHTML=h;
}
async function refresh(){await load();const y=A.scrollTop;aRender();A.scrollTop=y}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.85)};i.src=URL.createObjectURL(f)})}
async function up(id,blob,k){
 const path=id+"/"+k+"-"+Date.now()+".jpg";
 const{error}=await sb.storage.from("productos").upload(path,blob,{contentType:"image/jpeg",upsert:true});
 if(error)throw error;
 return sb.storage.from("productos").getPublicUrl(path).data.publicUrl}
async function saveP(){
 const n=edit==="new";
 const id=n?g("f_id").value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"-"):edit;
 const name=g("f_n").value.trim();
 if(!id||!name){alert("Falta la referencia o el nombre");return}
 if(n&&CAT.some(p=>p.id===id)){alert("Esa referencia ya existe");return}
 const row={id,type:g("f_t").value.trim()||"Otros",name,color:g("f_c").value,accent:g("f_a").value,
  price_detal:+g("f_pd").value||0,price_dist:+g("f_pi").value||0,price_mayor:+g("f_pm").value||0,disc_detal:g("f_d").checked};
 const bt=g("f_save");bt.disabled=true;bt.textContent="Guardando…";
 try{
  for(const[k,i]of[["img_front","f_if"],["img_back","f_ib"]]){const f=g(i).files[0];if(f)row[k]=await up(id,await shrink(f),k)}
  let r=await sb.from("products").upsert(row);if(r.error)throw r.error;
  const want=g("f_s").value.split(",").map(x=>x.trim()).filter(Boolean);
  const have=n?[]:Object.keys(CAT.find(p=>p.id===id).s);
  const gone=have.filter(x=>!want.includes(x));
  if(gone.length){r=await sb.from("product_sizes").delete().eq("product_id",id).in("size",gone);if(r.error)throw r.error}
  const add=want.filter(x=>!have.includes(x)).map(z=>({product_id:id,size:z,stock:0,sort:want.indexOf(z)}));
  if(add.length){r=await sb.from("product_sizes").insert(add);if(r.error)throw r.error}
  edit=null;await refresh();
 }catch(e){alert("Error: "+e.message);bt.disabled=false;bt.textContent="Guardar"}
}
A.addEventListener("click",async e=>{
 const b=e.target.closest("button");
 if(!b){if(e.target===A)A.close();return}
 if(b.hasAttribute("data-close")){A.close();return}
 const a=b.dataset.a,id=b.dataset.id;
 try{
  if(a==="login"){const{data,error}=await sb.auth.signInWithPassword({email:g("em").value,password:g("pw").value});if(error)throw error;sess=data.session;updSel();aRender()}
  else if(a==="out"){await sb.auth.signOut();sess=null;updSel();aRender()}
  else if(a==="new"||a==="edit"){edit=a==="new"?"new":id;aRender()}
  else if(a==="back"){edit=null;aRender()}
  else if(a==="savep")await saveP();
  else if(a==="stock"){
   const rows=[...A.querySelectorAll('[data-ps="'+id+'"]')].map(i=>({product_id:id,size:i.dataset.z,stock:Math.max(0,parseInt(i.value)||0)}));
   const r=await sb.from("product_sizes").upsert(rows);if(r.error)throw r.error;b.textContent="¡Guardado!";await refresh()}
  else if(a==="zero"){if(!confirm("¿Marcar "+id+" como agotado en todas las tallas?"))return;
   const r=await sb.from("product_sizes").update({stock:0}).eq("product_id",id);if(r.error)throw r.error;await refresh()}
  else if(a==="tog"){const p=CAT.find(x=>x.id===id);
   const r=await sb.from("products").update({active:!p.active}).eq("id",id);if(r.error)throw r.error;await refresh()}
  else if(a==="del"){if(!confirm("¿Eliminar "+id+"? No se puede deshacer."))return;
   const r=await sb.from("products").delete().eq("id",id);if(r.error)throw r.error;await refresh()}
  else if(a==="tab"){atab=id;edit=null;ecus=null;await aLoad();aRender()}
  else if(a==="cnew"||a==="cedit"){ecus=a==="cnew"?"new":id;aRender()}
  else if(a==="cback"){ecus=null;aRender()}
  else if(a==="csave"){
   const row={cedula:g("c_c").value.replace(/\D/g,""),name:g("c_n").value.trim(),phone:g("c_p").value.trim(),email:g("c_e").value.trim(),city:g("c_ci").value.trim(),address:g("c_ad").value.trim(),type:g("c_t").value};
   if(row.cedula.length<5||!row.name){alert("Falta la cédula o el nombre");return}
   const r=ecus==="new"?await sb.from("customers").insert(row):await sb.from("customers").update(row).eq("id",ecus);
   if(r.error)throw r.error;ecus=null;await aLoad();aRender()}
  else if(a==="cdel"){if(!confirm("¿Eliminar este cliente?"))return;
   const r=await sb.from("customers").delete().eq("id",id);if(r.error)throw new Error("No se puede eliminar: el cliente tiene pedidos.");await aLoad();aRender()}
  else if(a==="rf"){rfil=id;aRender()}
  else if(a==="rsell"){if(!confirm("¿Registrar la venta final y descontar del inventario?"))return;
   const r=await sb.rpc("vender_apartado",{p_id:id});if(r.error)throw r.error;await aLoad();await load();aRender()}
  else if(a==="rrel"){if(!confirm("¿Liberar este apartado? Las unidades vuelven a estar disponibles."))return;
   const r=await sb.rpc("liberar_apartado",{p_id:id});if(r.error)throw r.error;await aLoad();await load();aRender()}
 }catch(x){alert("Error: "+x.message)}
});
document.getElementById("adm").onclick=async()=>{
 if(!sb){alert("Primero configura SB_URL y SB_KEY en el código.");return}
 const{data}=await sb.auth.getSession();sess=data.session;updSel();edit=null;ecus=null;atab="inv";aRender();A.showModal()};
// ===== ADMIN: clientes y pedidos =====
let CUS=[],RES=[],atab="inv",ecus=null,rfil="activo",cq="";
const tabsBar=()=>`<div class="tabs" style="margin:0 0 8px">${[["inv","Inventario"],["cli","Clientes"],["ped","Pedidos"]].map(([k,t])=>`<button class="tab ${atab===k?"on":""}" data-a="tab" data-id="${k}">${t}</button>`).join("")}</div>`;
async function aLoad(){
 if(atab==="cli"){const r=await sb.from("customers").select("*").order("name");if(r.error)throw r.error;CUS=r.data}
 if(atab==="ped"){const r=await sb.from("reservations").select("id,status,total,created_at,customers(name,cedula,type,phone,city,address),reservation_items(product_id,size,qty,unit_price)").order("created_at",{ascending:false}).limit(150);if(r.error)throw r.error;RES=r.data}
}
function cliHTML(){
 const q=cq.toLowerCase(),L=CUS.filter(c=>!q||(c.name+c.cedula+(c.phone||"")).toLowerCase().includes(q));
 return tabsBar()+`<div class="ba"><button class="btn mini" data-a="cnew">+ Nuevo cliente</button><button class="btn s mini" data-a="out">Salir</button><button class="x" data-close style="margin-left:auto">×</button></div>
 <input type="search" id="cq" placeholder="Buscar por nombre, cédula o teléfono" value="${esc(cq)}" style="width:100%;margin:8px 0">
 <small style="color:var(--mu)">${CUS.length} clientes registrados</small>
 ${L.map(c=>`<div class="ap"><div class="ah"><div style="flex:1"><b>${esc(c.name)}</b><br><small style="color:var(--mu)">CC ${esc(c.cedula)} · ${esc(c.phone||"sin teléfono")}${c.email?" · "+esc(c.email):""}${c.city?"<br>"+esc(c.city)+" · "+esc(c.address||""):""}</small></div><span class="chip ${c.type!=="detal"?"on":""}">${TN[c.type]}</span></div>
 <div class="ba" style="margin-top:8px"><button class="btn s mini" data-a="cedit" data-id="${c.id}">Editar</button><button class="btn s mini" data-a="cdel" data-id="${c.id}">Eliminar</button></div></div>`).join("")||'<div class="empty">Sin clientes</div>'}`}
function cusForm(){
 const n=ecus==="new",c=n?{cedula:"",name:"",phone:"",type:"detal"}:CUS.find(x=>x.id===ecus);
 return `<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${n?"Nuevo cliente":"Editar cliente"}</h2><button class="x" data-close>×</button></div>
 <div class="fm"><label>Cédula<input id="c_c" inputmode="numeric" value="${esc(c.cedula)}"></label>
 <label>Tipo de cliente<select id="c_t">${["detal","dist","mayor"].map(k=>`<option value="${k}" ${c.type===k?"selected":""}>${TN[k]}</option>`).join("")}</select></label>
 <label class="f">Nombre<input id="c_n" value="${esc(c.name)}"></label><label>Teléfono<input id="c_p" type="tel" value="${esc(c.phone||"")}"></label><label>Correo<input id="c_e" type="email" value="${esc(c.email||"")}"></label><label>Ciudad<input id="c_ci" value="${esc(c.city||"")}"></label><label>Dirección<input id="c_ad" value="${esc(c.address||"")}"></label></div>
 <div class="row"><button class="btn s" data-a="cback">Cancelar</button><button class="btn" data-a="csave">Guardar</button></div>`}
function pedHTML(){
 const L=RES.filter(r=>rfil==="activo"?r.status==="activo":r.status!=="activo"),ST={activo:"Apartado",vendido:"Vendido",cancelado:"Liberado"};
 return tabsBar()+`<div class="ba"><button class="tab ${rfil==="activo"?"on":""}" data-a="rf" data-id="activo">Apartados activos</button><button class="tab ${rfil!=="activo"?"on":""}" data-a="rf" data-id="hist">Historial</button><button class="x" data-close style="margin-left:auto">×</button></div>
 ${L.map(r=>{const c=r.customers||{};return `<div class="ap"><div class="ah"><div style="flex:1"><b>${esc(c.name||"—")}</b> <small style="color:var(--mu)">CC ${esc(c.cedula||"")} · ${esc(c.phone||"")}${c.city?" · "+esc(c.city):""}${c.address?" · "+esc(c.address):""}</small><br><small style="color:var(--mu)">${new Date(r.created_at).toLocaleString("es-CO")} · ${ST[r.status]}</small></div><b>${fmt(r.total)}</b></div>
 <div style="font-size:13px;margin:6px 0">${r.reservation_items.map(i=>`${i.qty} × ${esc(i.product_id)} talla ${esc(i.size)} · ${fmt(i.unit_price)} c/u`).join("<br>")}</div>
 ${r.status==="activo"?`<div class="ba"><button class="btn mini" data-a="rsell" data-id="${r.id}">Vender (descontar)</button><button class="btn s mini" data-a="rrel" data-id="${r.id}">Liberar</button></div>`:""}</div>`}).join("")||'<div class="empty">Nada por aquí</div>'}`}
A.addEventListener("input",e=>{if(e.target.id==="cq"){cq=e.target.value;aRender();const i=g("cq");i.focus();i.setSelectionRange(i.value.length,i.value.length)}});

// ===== CLIENTE Y FINALIZAR PEDIDO =====
let idle=null,kindNow="apart",CUST=null;
function updSel(){}
const C=document.getElementById("cdlg"),cb=document.getElementById("cbtn");
const XB='<div style="display:flex;justify-content:flex-end"><button class="x" data-close>×</button></div>';
function setCust(c){CUST=c;cb.textContent=c?"👤 "+c.first+" · "+TN[c.type]+" · Salir":"👤 Soy cliente";if(!c)Q={};grid()}
cb.onclick=()=>{
 if(CUST){setCust(null);return}
 if(!sb){alert("Falta configurar Supabase");return}
 C.innerHTML=XB+`<h2 style="margin:0 0 6px">¡Bienvenido de nuevo!</h2><p style="color:var(--mu);margin:0 0 12px">Escribe tu número de cédula y verás tus precios.</p>
 <input id="ced" inputmode="numeric" placeholder="Número de cédula" autofocus style="width:100%;padding:14px;font-size:22px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)">
 <div id="cmsg" style="color:#b45309;margin-top:8px;min-height:20px"></div>
 <div class="row"><button class="btn s" data-close>Cancelar</button><button class="btn" id="cgo" data-a="idgo">Continuar</button></div>`;
 C.showModal()};
async function ident(b){
 const ced=C.querySelector("#ced").value.replace(/\D/g,""),m=C.querySelector("#cmsg");
 if(ced.length<5){m.textContent="Escribe tu cédula completa";return}
 b.disabled=true;
 const{data,error}=await sb.rpc("lookup_customer",{p_ced:ced});b.disabled=false;
 if(error){m.textContent=error.message;return}
 if(!data){m.textContent="No encontramos esa cédula. Elige tus prendas y te registras al finalizar el pedido.";return}
 setCust({ced,first:data.first,type:data.type,has:data.has_contact,addr:data.has_addr});C.close()}
function submit(kind){
 const T=totals();if(!T.u)return;
 if(!sb){alert("Falta configurar Supabase");return}
 kindNow=kind;const w=T.hi!=="detal",ok=CUST&&CUST.has&&(!w||CUST.addr);
 const top=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${kind==="sell"?"Registrar venta":"Finaliza tu pedido"}</h2><button class="x" data-close>×</button></div>`;
 const bot=`<div id="rmsg" style="color:#b45309;margin-top:8px;min-height:18px"></div><div class="row"><button class="btn s" data-a="back">Volver</button><button class="btn" id="cgo" data-a="send">${kind==="sell"?"Registrar venta":"Confirmar y apartar"}</button></div>`;
 C.innerHTML=ok?top+`<p style="margin:10px 0">Pedido a nombre de <b>${esc(CUST.first)}</b> · ${TN[CUST.type]} · ${T.u} uds · Total <b>${fmt(T.t)}</b></p>`+bot
 :top+`<p style="color:var(--mu);margin:6px 0">${w?"Compra "+TN[T.hi].toLowerCase()+": necesitamos tus datos completos.":"Compra detal: déjanos tus datos de contacto."} Total <b>${fmt(T.t)}</b></p>
 <div class="fm"><label class="f">Cédula<input id="r_c" inputmode="numeric" value="${CUST?esc(CUST.ced):""}"></label>
 <label class="f">Nombre completo<input id="r_n"></label>
 <label>Teléfono<input id="r_p" type="tel"></label><label>Correo<input id="r_e" type="email"></label>
 ${w?'<label>Ciudad<input id="r_ci"></label><label>Dirección<input id="r_ad"></label>':""}</div>`+bot;
 D.close();C.showModal();
}
C.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=C.querySelector("#cgo");if(b)b.click()}});
C.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-close")){C.close();return}
 if(b.dataset.a==="back"){C.close();order();return}
 try{if(b.dataset.a==="idgo")await ident(b);if(b.dataset.a==="send")await send(b)}catch(x){alert("Error: "+x.message)}
});
async function send(b){
 const v=i=>{const x=C.querySelector("#"+i);return x?x.value.trim():""},m=C.querySelector("#rmsg");
 const T=totals(),w=T.hi!=="detal",direct=!C.querySelector("#r_n");
 let ced,name,f={p_name:"",p_phone:"",p_email:"",p_city:"",p_address:""};
 if(direct){ced=CUST.ced;name=CUST.first}
 else{
  ced=v("r_c").replace(/\D/g,"");name=v("r_n");
  const err=ced.length<5?"Escribe tu cédula completa":name.length<2?"Escribe tu nombre":v("r_p").replace(/\D/g,"").length<7?"Escribe un teléfono válido":!/^\S+@\S+\.\S+$/.test(v("r_e"))?"Escribe un correo válido":(w&&(v("r_ci").length<2||v("r_ad").length<5))?"Falta la ciudad o la dirección":"";
  if(err){m.textContent=err;return}
  f={p_name:name,p_phone:v("r_p"),p_email:v("r_e"),p_city:v("r_ci"),p_address:v("r_ad")};
 }
 const items=[];CAT.forEach(p=>Object.keys(p.s).forEach(z=>{const q=Q[p.id+"|"+z];if(q)items.push({product_id:p.id,size:z,qty:q})}));
 b.disabled=true;b.textContent="Enviando…";
 const{data,error}=await sb.rpc(kindNow==="sell"?"vender_directo":"apartar",{p_ced:ced,...f,p_items:items});
 if(error){m.textContent=error.message;b.disabled=false;b.textContent="Reintentar";return}
 setCust(null);await load();C.close();
 D.innerHTML=`<div class="empty"><h2 style="color:var(--tx);margin:0 0 6px">${kindNow==="sell"?"Venta registrada":"¡Pedido apartado!"}</h2>
 <p>${esc(name)}, tu referencia es <b>#${data.n}</b> por <b>${fmt(data.total)}</b>.${kindNow==="sell"?"":"<br>Tus unidades quedaron reservadas. Pasa por caja para completar la compra."}</p></div><div class="row"><button class="btn" data-close>Listo</button></div>`;
 D.showModal();
}
// Tablet compartida: tras 3 min sin tocar, se cierra la sesión del cliente y del admin y se vacía el pedido
function bump(){clearTimeout(idle);idle=setTimeout(async()=>{
 if(sess){try{await sb.auth.signOut()}catch(e){}sess=null}
 [A,D,C].forEach(d=>d.open&&d.close());setCust(null)},180000)}
["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,bump,true));
if(SB_URL.startsWith("http")){
 sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
 sb.channel("cat").on("postgres_changes",{event:"*",schema:"public"},()=>load()).subscribe();
}
load();bump();
</script>
</body>
</html>
